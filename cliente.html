<!DOCTYPE html>
<html lang="pt-BR"><head>
<link rel="icon" type="image/svg+xml" href="favicon.svg"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do cliente — S.A.R.A</title><link rel="stylesheet" href="style.css"><style>
.client-wrap{max-width:850px;margin:0 auto;padding:48px 22px}.client-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-top:22px}.client-card p{color:var(--muted);line-height:1.6}.client-form{display:flex;gap:10px;margin-top:18px}.client-form input{flex:1;min-width:0}.result{margin-top:18px;padding:16px;border-radius:12px;background:var(--bg3);line-height:1.6}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}@media(max-width:600px){.client-form{flex-direction:column}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="client-wrap"><div class="top"><div><div class="eyebrow">S.A.R.A · Consumidor</div><h1>Área do cliente</h1><p id="boas-vindas">Carregando sua conta...</p></div><button id="sair" class="btn btn-secondary">Sair</button></div><section class="client-card"><h2>Verificar autenticidade</h2><p>Digite o código impresso no QR Code do produto ou cole o endereço do QR Code para consultar sua autenticidade.</p><form id="form-verificar" class="client-form"><input class="field-input" id="codigo" placeholder="Código do produto ou link do QR Code" required><button class="btn btn-primary" type="submit">Verificar</button></form><div id="resultado" class="result" hidden aria-live="polite"></div></section></main>
<script src="db.js"></script><script>
(async()=>{if(!await exigirPerfil(['cliente']))return;const s=saraSessao();document.getElementById('boas-vindas').textContent='Olá, '+(s.perfil?.nome||s.user.email)+'. Consulte aqui a autenticidade dos seus produtos.'})();
document.getElementById('sair').addEventListener('click',async()=>{await logout();location.href='login.html'});
document.getElementById('form-verificar').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),out=document.getElementById('resultado');b.disabled=true;b.textContent='Consultando...';out.hidden=false;out.textContent='Consultando o registro...';try{const r=await verificarCodigo(document.getElementById('codigo').value);const v=Array.isArray(r)?r[0]:r;out.textContent=v?.mensagem||v?.resultado||'Consulta concluída.';if(v?.resultado&&v?.mensagem)out.textContent=v.mensagem+' — '+v.resultado;}catch(err){out.textContent=err.message||'Não foi possível verificar o código.'}finally{b.disabled=false;b.textContent='Verificar'}});
</script></body></html>
