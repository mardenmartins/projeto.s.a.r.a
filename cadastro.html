<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de cliente — S.A.R.A</title><link rel="stylesheet" href="style.css"><style>
body{min-height:100vh;display:grid;place-items:center;padding:24px}.cadastro{width:min(460px,100%);background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px;box-shadow:0 24px 70px #0005}.cadastro h1{font-size:27px;margin:8px 0}.cadastro p{color:var(--muted);line-height:1.6}.cadastro form{display:grid;gap:16px;margin-top:24px}.cadastro input{width:100%}.cadastro label{display:block;margin-bottom:7px}.cadastro .msg{margin-top:16px;font-size:14px;line-height:1.6}.cadastro a{color:var(--accent)}.cadastro button{width:100%}
</style></head><body><main class="cadastro"><a href="login.html">← Voltar ao login</a><div class="eyebrow" style="margin-top:24px">S.A.R.A · Área do consumidor</div><h1>Crie sua conta</h1><p>Cadastre-se para acessar a área do cliente e consultar a autenticidade de produtos.</p>
<form id="form-cadastro"><div><label for="nome">Nome completo</label><input class="field-input" id="nome" required maxlength="120" autocomplete="name" placeholder="Seu nome"></div><div><label for="email">E-mail</label><input class="field-input" id="email" type="email" required autocomplete="email" placeholder="voce@email.com"></div><div><label for="senha">Senha</label><input class="field-input" id="senha" type="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></div><div><label for="confirmar">Confirmar senha</label><input class="field-input" id="confirmar" type="password" required minlength="8" autocomplete="new-password" placeholder="Repita a senha"></div><button class="btn btn-primary" type="submit">Criar minha conta</button></form><div id="mensagem" class="msg" role="status"></div></main>
<script src="db.js?v=20261106-2"></script><script>
// Cadastro independente de cache antigo do db.js.
async function cadastrarCliente(nome,email,senha){
  const resposta=await fetch("https://awtoipbwnnrwvvznqjyb.supabase.co/auth/v1/signup",{method:"POST",headers:{"apikey":"sb_publishable_LuCAAdnBbaKw64G_cYa2_A_pxTaNN8j","Content-Type":"application/json"},body:JSON.stringify({email:email.trim(),password:senha,data:{nome:nome.trim()}})});
  const dados=await resposta.json().catch(()=>({}));
  if(!resposta.ok) throw new Error(dados.msg||dados.message||dados.error_description||dados.error||"Não foi possível criar a conta (HTTP "+resposta.status+").");
  if(dados.access_token && typeof saraSalvarSessao==="function") saraSalvarSessao(dados);
  return {sessao:!!dados.access_token,email:dados.user?.email||email};
}

document.getElementById('form-cadastro').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),m=document.getElementById('mensagem');const nome=document.getElementById('nome').value,email=document.getElementById('email').value,senha=document.getElementById('senha').value,confirmar=document.getElementById('confirmar').value;m.textContent='';if(senha!==confirmar){m.textContent='As senhas não coincidem.';return}b.disabled=true;b.textContent='Criando conta...';try{const r=await cadastrarCliente(nome,email,senha);if(r.sessao){await autenticar(email,senha);location.href='cliente.html'}else{f.hidden=true;m.textContent='Cadastro iniciado! Verifique sua caixa de entrada e confirme o e-mail para ativar sua conta. Depois, entre pelo login do S.A.R.A.'}}catch(err){m.textContent=err.message||'Não foi possível concluir o cadastro.';b.disabled=false;b.textContent='Criar minha conta'}});
</script></body></html>
